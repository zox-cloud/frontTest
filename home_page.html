<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style/home_style.css">
</head>
<body>
<div class="container">
  <div class="weather-card">
    <div class="weather-info">
      <div class="temperature" id="temperature">--&deg;</div>
      <div class="details">
        <div class="high-low" id="high-low">H:--&deg; L:--&deg;</div>
        <div class="location" id="location">Fetching location...</div>
      </div>
    </div>
    <div class="condition" id="condition">--</div>
  </div>
</div>

<div class="content">
  <p class="empty-text">Nothing here. For now.</p>
  <p class="sub-text">Please, add clothes to see your recommendations</p>
  <button class="add-clothes-btn" onclick="addClothes()">+ Add your clothes</button>
</div>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-tab="wardrobe">
    <div class="icon wardrobe-icon"></div>
    <span>Wardrobe</span>
  </button>
  <button class="nav-item" data-tab="home">
    <div class="icon home-icon"></div>
    <span>Home</span>
  </button>
  <button class="nav-item" data-tab="profile">
    <div class="icon profile-icon"></div>
    <span>Profile</span>
  </button>
</nav>

<script>
  async function getWeather() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const apiKey = 'd31e50190104c1c8594466f52a759f12';
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data.cod !== 200) {
            alert('Failed to fetch weather data!');
            return;
          }

          displayWeather(data);
        } catch (error) {
          console.error('Error fetching the weather data:', error);
          alert('Failed to fetch weather data.');
        }
      }, () => {
        alert('Geolocation permission denied. Unable to fetch weather data.');
      });
    } else {
      alert('Geolocation is not supported by your browser.');
    }
  }

  function displayWeather(data) {
    const locationElement = document.getElementById('location');
    const descriptionElement = document.getElementById('condition');
    const temperatureElement = document.getElementById('temperature');
    const highLowElement = document.getElementById('high-low');

    const city = data.name;
    const country = data.sys.country;
    const description = data.weather[0].description;
    const temperature = Math.round(data.main.temp);
    const tempMin = Math.round(data.main.temp_min);
    const tempMax = Math.round(data.main.temp_max);

    locationElement.textContent = `${city}, ${country}`;
    descriptionElement.textContent = description.charAt(0).toUpperCase() + description.slice(1);
    temperatureElement.innerHTML = `${temperature}&deg;`;
    highLowElement.innerHTML = `H:${tempMax}&deg; L:${tempMin}&deg;`;
  }

  // Trigger the weather fetch when the page loads
  document.addEventListener('DOMContentLoaded', getWeather);
</script>
</body>
</html>
